name: Validate occupational results (R)
on:
  push:
    paths:
      - 'R/**'
      - 'data/processed/**'
      - '.github/workflows/validate-results.yml'
  pull_request:
    paths:
      - 'R/**'
      - 'data/processed/**'
      - '.github/workflows/validate-results.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - name: Parse all maintained R scripts
        run: Rscript R/test_script_syntax.R
      - name: Validate source archive helpers
        run: Rscript R/test_source_archive_helpers.R
      - name: Reproduce processed-data results
        run: Rscript R/reproduce_descriptive_results.R
      - name: Render primary research figure
        run: Rscript R/create_primary_figures.R
      - name: Show output
        run: |
          test -f results/reproduced/checked_occupational_results.csv
          head -n 3 results/reproduced/checked_occupational_results.csv
      - name: Archive verified derived result
        uses: actions/upload-artifact@v4
        with:
          name: occupational-reconstruction
          path: |
            results/reproduced/checked_occupational_results.csv
            figures/generated/primary_employment_real_wage.svg
            figures/generated/primary_employment_real_wage.pdf
